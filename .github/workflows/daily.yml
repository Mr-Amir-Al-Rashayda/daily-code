name: Daily Python example

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-example
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish daily batch
        shell: bash
        run: |
          set -euo pipefail
          root_commit=$(git rev-list --max-parents=0 HEAD | head -1)
          git config user.name "$(git show -s --format=%an "$root_commit")"
          git config user.email "$(git show -s --format=%ae "$root_commit")"
          python3 scripts/publish_daily.py
          git push origin HEAD:main
